{% extends 'global/base.html' %}

{% block content %}
<div class="max-w-md mx-auto mt-20 bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl text-center">
    <div class="w-16 h-16 bg-red-500/10 text-red-500 rounded-full flex items-center justify-center mx-auto mb-6">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
    </div>
    
    <h2 class="text-xl font-black text-white uppercase mb-2">Confirmar Exclusão</h2>
    <p class="text-slate-400 text-sm mb-8 font-mono">Deseja realmente remover a empresa <span class="text-white font-bold">{{ object.nome }}</span> do sistema?</p>

    <form method="post">
        {% csrf_token %}
        <div class="flex flex-col gap-3">
            <button type="submit" class="w-full bg-red-600 hover:bg-red-500 text-white font-black py-3 rounded-xl uppercase text-xs tracking-widest transition-all">
                Sim, Deletar Registro
            </button>
            <a href="{% url 'list_empresas' %}" class="text-slate-500 hover:text-white text-xs font-mono uppercase py-2">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
