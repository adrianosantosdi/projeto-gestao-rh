{% extends 'global/base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-8">
        <h2 class="text-2xl font-black text-white uppercase tracking-tighter italic">
            Lançar <span class="text-blue-500">Hora Extra</span>
        </h2>
        <p class="text-[10px] font-mono text-slate-500 uppercase tracking-widest mt-1">
            Registro de jornada suplementar
        </p>
    </div>

    <form method="post" class="bg-slate-900 border border-slate-800 p-8 rounded-2xl space-y-6 shadow-2xl">
        {% csrf_token %}

        <div class="flex flex-col space-y-2">
            <label class="text-[10px] font-mono text-slate-500 uppercase tracking-widest font-bold">Colaborador</label>
            {{ form.funcionario }}
        </div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <div class="md:col-span-1 flex flex-col space-y-2">
                <label class="text-[10px] font-mono text-slate-500 uppercase tracking-widest font-bold">Horas</label>
                {{ form.horas }}
            </div>

            <div class="md:col-span-3 flex flex-col space-y-2">
                <label class="text-[10px] font-mono text-slate-500 uppercase tracking-widest font-bold">Motivo /
                    Justificativa</label>
                {{ form.motivo }}
            </div>
        </div>

        <div class="flex items-center justify-end gap-6 pt-6 border-t border-slate-800/50">
            <a href="{% url 'list_funcionarios' %}"
                class="text-slate-500 hover:text-white text-[10px] font-mono uppercase tracking-widest transition-colors">Cancelar</a>
            <button type="submit"
                class="bg-blue-600 hover:bg-blue-500 text-white px-10 py-4 rounded-xl font-black text-xs uppercase tracking-widest transition-all shadow-lg shadow-blue-600/20 active:scale-95">
                Confirmar Lançamento
            </button>
        </div>
    </form>
</div>
{% endblock %}
