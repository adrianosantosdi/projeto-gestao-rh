{% extends 'global/base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto bg-slate-800 border border-slate-700 rounded-3xl shadow-2xl overflow-hidden mt-10">
    <div class="p-8 border-b border-slate-700 bg-slate-800/50">
        <h2 class="text-2xl font-black text-white uppercase tracking-tighter">
            {% if object %} Editar Unidade: {{ object.nome }} {% else %} Registrar Nova Unidade {% endif %}
        </h2>
    </div>

    <form method="post" class="p-8 space-y-6">
        {% csrf_token %}

        {% for field in form %}
        <div>
            <label class="block text-slate-400 text-xs font-mono uppercase mb-2 ml-1">
                {{ field.label }}
            </label>
            <div class="relative">
                <input type="{{ field.field.widget.input_type }}" name="{{ field.name }}"
                    value="{{ field.value|default_if_none:'' }}"
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-blue-500 outline-none transition-all font-mono">
            </div>
            {% if field.errors %}
            <p class="text-red-500 text-xs mt-1 font-mono uppercase">{{ field.errors.0 }}</p>
            {% endif %}
        </div>
        {% endfor %}

        <div class="flex space-x-4 pt-4">
            <button type="submit"
                class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl shadow-lg transition-all active:scale-95 uppercase text-sm tracking-widest">
                Confirmar Protocolo
            </button>
            <a href="{% url 'list_empresas' %}"
                class="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-bold py-4 rounded-xl text-center transition-all uppercase text-sm tracking-widest">
                Abortar
            </a>
        </div>
    </form>
</div>
{% endblock %}
