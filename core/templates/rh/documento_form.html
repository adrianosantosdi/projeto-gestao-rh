{% extends 'global/base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h2 class="text-2xl font-black text-white uppercase mb-8 tracking-tighter italic">
        Anexar <span class="text-blue-500">Documento</span>
    </h2>

    <form method="post" enctype="multipart/form-data"
        class="bg-slate-900 border border-slate-800 p-8 rounded-2xl space-y-6 shadow-2xl">
        {% csrf_token %}

        <div class="flex flex-col space-y-2">
            <label class="text-[10px] font-mono text-slate-500 uppercase tracking-widest font-bold">Descrição do
                Arquivo</label>
            {{ form.descricao }}
        </div>

        <div class="flex flex-col space-y-2">
            <label class="text-[10px] font-mono text-slate-500 uppercase tracking-widest font-bold">Selecionar Arquivo
                (PDF, Imagem, etc)</label>
            {{ form.arquivo }}
        </div>

        <div class="flex flex-col space-y-2">
            <label class="text-[10px] font-mono text-slate-500 uppercase tracking-widest font-bold">Vincular ao
                Funcionário</label>
            {{ form.pertence }}
        </div>

        <div class="flex items-center justify-end gap-4 pt-4">
            <a href="{% url 'list_funcionarios' %}"
                class="text-slate-500 hover:text-white text-xs font-mono uppercase">Voltar</a>
            <button type="submit"
                class="bg-blue-600 hover:bg-blue-500 text-white px-8 py-3 rounded-xl font-black text-xs uppercase tracking-widest transition-all">
                Fazer Upload
            </button>
        </div>
    </form>
</div>
{% endblock %}
