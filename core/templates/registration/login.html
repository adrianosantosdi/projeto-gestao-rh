{% extends 'global/base.html' %}

{% block content %}
<div class="max-w-md w-full mx-auto bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl overflow-hidden">
    <div class="p-8">
        <div class="text-center mb-8">
            <div class="inline-block p-4 rounded-full bg-blue-500/10 mb-4 text-blue-500">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A10.003 10.003 0 0012 21a10.003 10.003 0 008.381-4.562l.054.09c-1.744 2.772-2.753 6.054-2.753 9.571" />
                </svg>
            </div>
            <h2 class="text-2xl font-black text-white tracking-tighter uppercase">Acesso ao Sistema</h2>
            <p class="text-slate-400 font-mono text-xs uppercase mt-2 tracking-widest">Protocolo RH-NASA</p>
        </div>

        <form method="post" class="space-y-6">
            {% csrf_token %}
            <div>
                <label class="block text-slate-400 text-xs font-mono uppercase mb-2">Usuário</label>
                <input type="text" name="username"
                    class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition-all">
            </div>
            <div>
                <label class="block text-slate-400 text-xs font-mono uppercase mb-2">Chave de Acesso</label>
                <input type="password" name="password"
                    class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition-all">
            </div>
            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-500/20 transition-all active:scale-95">
                LOGAR
            </button>
        </form>
    </div>
</div>
{% endblock %}
