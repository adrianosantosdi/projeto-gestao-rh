<aside class="w-64 bg-slate-950 border-r border-slate-800 sticky top-0 h-screen overflow-y-auto p-4 space-y-2 flex flex-col shadow-2xl custom-scrollbar">
    
    <div class="px-3 py-6 mb-2">
        <div class="flex items-center gap-3">
            <div class="w-7 h-7 bg-blue-600 rounded-lg flex items-center justify-center shadow-lg shadow-blue-600/20">
                <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            </div>
            <span class="text-white font-black uppercase italic tracking-tighter text-lg">Core<span class="text-blue-500">RH</span></span>
        </div>
    </div>

    <a href="/" class="flex items-center space-x-3 p-3 rounded-xl hover:bg-slate-900 border border-transparent hover:border-slate-800 text-slate-400 hover:text-white transition-all group">
        <div class="p-1.5 rounded-lg bg-slate-800 group-hover:bg-blue-600/10 transition-colors">
            <svg class="w-4 h-4 group-hover:text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
            </svg>
        </div>
        <span class="text-[10px] font-bold uppercase tracking-[0.15em]">Dashboard</span>
    </a>

    <div class="pt-6 pb-2 px-3 text-[9px] font-black text-slate-600 uppercase tracking-[0.3em] flex items-center gap-2">
        <span class="w-4 h-[1px] bg-slate-800"></span> Gestão Operacional
    </div>

    <details class="group" {% if 'empresa' in request.path %}open{% endif %}>
        <summary class="flex items-center justify-between p-3 rounded-xl hover:bg-slate-900 text-slate-400 hover:text-white cursor-pointer list-none transition-all border border-transparent hover:border-slate-800 group-open:bg-slate-900/50">
            <div class="flex items-center space-x-3">
                <svg class="w-4 h-4 group-hover:text-blue-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-10V4m0 10V4m-4 18c0 1.105.895 2 2 2s2-.895 2-2M9 21c0 1.105.895 2 2 2s2-.895 2-2" />
                </svg>
                <span class="text-[10px] font-bold uppercase tracking-[0.15em]">Empresas</span>
            </div>
            <svg class="w-3 h-3 transition-transform duration-300 group-open:rotate-180 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </summary>
        <div class="pl-8 pr-2 mt-1 space-y-1 border-l-2 border-slate-800 ml-5">
            <a href="{% url 'list_empresas' %}" class="block text-[10px] text-slate-500 hover:text-blue-400 py-2 uppercase font-bold transition-colors">Listagem Geral</a>
            <a href="{% url 'create_empresa' %}" class="block text-[10px] text-slate-500 hover:text-blue-400 py-2 uppercase font-bold transition-colors">Novo Cadastro</a>
        </div>
    </details>

    <details class="group" {% if 'departamento' in request.path %}open{% endif %}>
        <summary class="flex items-center justify-between p-3 rounded-xl hover:bg-slate-900 text-slate-400 hover:text-white cursor-pointer list-none transition-all border border-transparent hover:border-slate-800 group-open:bg-slate-900/50">
            <div class="flex items-center space-x-3">
                <svg class="w-4 h-4 group-hover:text-purple-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
                </svg>
                <span class="text-[10px] font-bold uppercase tracking-[0.15em]">Departamentos</span>
            </div>
            <svg class="w-3 h-3 transition-transform duration-300 group-open:rotate-180 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </summary>
        <div class="pl-8 pr-2 mt-1 space-y-1 border-l-2 border-slate-800 ml-5">
            <a href="{% url 'list_departamentos' %}" class="block text-[10px] text-slate-500 hover:text-purple-400 py-2 uppercase font-bold transition-colors">Ver Todos</a>
            <a href="{% url 'create_departamento' %}" class="block text-[10px] text-slate-500 hover:text-purple-400 py-2 uppercase font-bold transition-colors">Configurar Setor</a>
        </div>
    </details>

    <details class="group" {% if 'funcionario' in request.path %}open{% endif %}>
        <summary class="flex items-center justify-between p-3 rounded-xl hover:bg-slate-900 text-slate-400 hover:text-white cursor-pointer list-none transition-all border border-transparent hover:border-slate-800 group-open:bg-slate-900/50">
            <div class="flex items-center space-x-3">
                <svg class="w-4 h-4 group-hover:text-cyan-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                </svg>
                <span class="text-[10px] font-bold uppercase tracking-[0.15em]">Funcionários</span>
            </div>
            <svg class="w-3 h-3 transition-transform duration-300 group-open:rotate-180 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </summary>
        <div class="pl-8 pr-2 mt-1 space-y-1 border-l-2 border-slate-800 ml-5">
            <a href="{% url 'list_funcionarios' %}" class="block text-[10px] text-slate-500 hover:text-cyan-400 py-2 uppercase font-bold transition-colors">Listar Equipe</a>
            <a href="{% url 'create_funcionario' %}" class="block text-[10px] text-slate-500 hover:text-cyan-400 py-2 uppercase font-bold transition-colors">Novo Registro</a>
        </div>
    </details>

    <details class="group" {% if 'documento' in request.path %}open{% endif %}>
        <summary class="flex items-center justify-between p-3 rounded-xl hover:bg-slate-900 text-slate-400 hover:text-white cursor-pointer list-none transition-all border border-transparent hover:border-slate-800 group-open:bg-slate-900/50">
            <div class="flex items-center space-x-3">
                <svg class="w-4 h-4 group-hover:text-emerald-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                <span class="text-[10px] font-bold uppercase tracking-[0.15em]">Documentos</span>
            </div>
            <svg class="w-3 h-3 transition-transform duration-300 group-open:rotate-180 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </summary>
        <div class="pl-8 pr-2 mt-1 space-y-1 border-l-2 border-slate-800 ml-5">
            <a href="{% url 'list_documentos' %}" class="block text-[10px] text-slate-500 hover:text-emerald-400 py-2 uppercase font-bold transition-colors">Repositório</a>
            <a href="{% url 'create_documento' %}" class="block text-[10px] text-slate-500 hover:text-emerald-400 py-2 uppercase font-bold transition-colors">Upload Protocolo</a>
        </div>
    </details>

    <details class="group" {% if 'hora' in request.path %}open{% endif %}>
        <summary class="flex items-center justify-between p-3 rounded-xl hover:bg-slate-900 text-slate-400 hover:text-white cursor-pointer list-none transition-all border border-transparent hover:border-slate-800 group-open:bg-slate-900/50">
            <div class="flex items-center space-x-3">
                <svg class="w-4 h-4 group-hover:text-orange-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span class="text-[10px] font-bold uppercase tracking-[0.15em]">Horas Extras</span>
            </div>
            <svg class="w-3 h-3 transition-transform duration-300 group-open:rotate-180 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </summary>
        <div class="pl-8 pr-2 mt-1 space-y-1 border-l-2 border-slate-800 ml-5">
            <a href="{% url 'list_horas' %}" class="block text-[10px] text-slate-500 hover:text-orange-400 py-2 uppercase font-bold transition-colors">Histórico</a>
            <a href="{% url 'create_hora' %}" class="block text-[10px] text-slate-500 hover:text-orange-400 py-2 uppercase font-bold transition-colors">Lançar Horas</a>
        </div>
    </details>

</aside>
